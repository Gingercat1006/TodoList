<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <title>Todoリスト</title>
</head>

<body>
    <h1>Todo追加・編集・削除</h1>

    <table>
        <caption>編集画面</caption>
        <thead>
            <tr>
                <th>やること</th>
                <th>タスク詳細</th>
                <th>カテゴリ名</th>
                <th>締切日</th>
                <th>ステータス</th>
                <th>完了</th>
            </tr>
        </thead>

        <tbody>
            <tr form th:action="@{/taskLists/update}" method="post">
                <td input type="hidden" name="id" th:value="${task.id}"></td>
                <td input type="text" name="name" th:value="${task.name}"></td>
                <td textarea name="detail" th:text="${task.detail}"></textarea></td>
                <td input type="date" name="dueDate" th:value="${task.dueDate}"></td>

                <td select name="categoryId">
                    <option th:each="category : ${categories}" th:value="${category.categoryId}"
                        th:text="${category.name}">
                    </option>
                    </select>
                </td>
                <td input type="checkbox" name="status" value="true" th:checked="${task.status}">
                    <button type="submit">更新</button>
                </td>
                </form>
            </tr>
        </tbody>
    </table>
</body>

</html>
